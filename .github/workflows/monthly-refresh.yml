name: Monthly FIDE ratings refresh

# Runs automatically on the 3rd of every month at 09:00 UTC (FIDE typically
# publishes the new standard rating list on the 1st, so this gives a
# 2-day buffer). Can also be triggered manually from the Actions tab for
# testing or an out-of-band refresh.
on:
  schedule:
    - cron: "0 9 3 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Try up to 3 times to pull the new FIDE list. Timeouts here are
      # transient network issues on ratings.fide.com; a quick retry usually
      # succeeds. If all attempts fail we still fall through so downstream
      # steps (page rebuild + Neocities deploy) can pick up any source-code
      # changes that were pushed since the last deploy.
      - name: Run monthly refresh script
        id: refresh
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "::group::Refresh attempt $attempt"
            if python3 data/refresh_dashboard.py; then
              echo "::endgroup::"
              echo "refresh_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed, sleeping 30s…"
            sleep 30
          done
          echo "refresh_ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::All 3 refresh attempts failed — will still rebuild pages + deploy from committed data.json"
          exit 0

      # Always rebuild pages, even if refresh failed — build_pages.py reads
      # from the committed data.json so it produces a valid site regardless.
      - name: Rebuild per-player static pages + sitemap
        run: python3 data/build_pages.py

      - name: Commit and push updated data + pages
        run: |
          git config user.name "gm-almanac-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- gm-dashboard/data.json gm-dashboard/player gm-dashboard/sitemap.xml; then
            echo "No changes to data.json or generated pages — FIDE list unchanged or already up to date."
            exit 0
          fi
          git add gm-dashboard/data.json gm-dashboard/player gm-dashboard/sitemap.xml data/refresh_log.json 2>/dev/null || true
          # Handle case where refresh failed and refresh_log.json wasn't updated
          git add gm-dashboard/data.json gm-dashboard/player gm-dashboard/sitemap.xml
          if [ -f data/refresh_log.json ]; then
            PERIOD=$(python3 -c "import json; print(json.load(open('data/refresh_log.json')).get('rating_period', 'unknown'))")
          else
            PERIOD="page-rebuild-only"
          fi
          git commit -m "Monthly refresh + page rebuild: ${PERIOD}"
          git push

      - name: Upload refresh log as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: data/refresh_log.json
          retention-days: 90

      # After the monthly refresh has committed new data + player pages,
      # sync the gm-dashboard/ folder to Neocities so scfromor.com sees the
      # new FIDE ratings, regenerated player pages, and sitemap without any
      # manual upload. Uses bcomnes/deploy-to-neocities which only uploads
      # changed files (safe for the 2,146-page directory).
      #
      # The Neocities API deploys to the SITE ROOT, so we stage the folder
      # into staging/chess/grandmaster_almanac/ to match the live URL path
      # scfromor.com/chess/grandmaster_almanac/. cleanup: false guarantees
      # nothing outside this subpath is touched — your other subsites are
      # never orphaned or deleted.
      - name: Re-checkout after auto-commit
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Stage files under matching subpath
        run: |
          mkdir -p staging/chess/grandmaster_almanac
          cp -R gm-dashboard/. staging/chess/grandmaster_almanac/
          echo "Staged file count:"
          find staging -type f | wc -l

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true
          dist_dir: staging
