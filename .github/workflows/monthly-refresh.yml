name: Monthly FIDE ratings refresh

# FIDE publishes the new standard rating list on the 1st of each month.
#
# We run daily on the 3rd through the 9th at 09:00 UTC rather than only on the
# 3rd. This is a SELF-HEALING catch-up window, not seven times the work: the
# first step checks whether gm-dashboard/data.json already carries the current
# rating period and, if so, the whole job exits immediately as a no-op. Once a
# month succeeds, the remaining days cost a few seconds each.
#
# Why: on 2026-08-03 every FIDE download attempt hung, the job still reported
# success, and the site served JUL26 ratings for the rest of the month. A
# single scheduled attempt per month means one bad morning at FIDE costs a
# full month of stale data. Six extra chances fixes that automatically.
on:
  schedule:
    - cron: "0 9 3-9 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if data.json already has the current rating period"
        type: boolean
        default: true
      list_url:
        description: "Optional: URL of a standard_rating_list.zip to use instead of ratings.fide.com (workaround for the datacenter-IP block)"
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Cheap no-op gate for the catch-up window. Skips the rest of the job on
      # days when the current month's list is already committed.
      - name: Decide whether a refresh is needed
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "Manual dispatch with force=true — running regardless of current state."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(python3 data/check_freshness.py --is-current)
          if [ "$CURRENT" = "yes" ]; then
            echo "data.json already has the current rating period — nothing to do."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "data.json is behind the current rating period — refreshing."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Two attempts, 90 s apart. data/fide_source.py already walks its own
      # source chain (override -> official host -> Wayback snapshot -> Save
      # Page Now) with exponential backoff on the Archive, so the old 3x outer
      # loop mostly just multiplied the wait on a genuine outage. One retry is
      # enough to ride out a transient blip.
      #
      # Still continue-on-error: we want page rebuilds and code-only deploys to
      # proceed. Staleness is caught and reported by the explicit gate at the
      # end of the job.
      - name: Run refresh script
        id: refresh
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        env:
          # Empty on scheduled runs, so the official FIDE URL is used as normal.
          GM_FIDE_LIST_URL: ${{ inputs.list_url }}
        run: |
          for attempt in 1 2; do
            echo "::group::Refresh attempt $attempt"
            if python3 data/refresh_dashboard.py; then
              echo "::endgroup::"
              echo "refresh_ok=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 2 ]; then
              echo "Attempt $attempt failed — sleeping 90s before retry…"
              sleep 90
            fi
          done
          echo "refresh_ok=false" >> "$GITHUB_OUTPUT"
          echo "::warning::Both refresh attempts failed — rebuilding pages from committed data.json. The freshness gate at the end of this job will fail the run."
          exit 0

      # Enrichment runs regardless of whether the FIDE download succeeded:
      #   - fills playstyle radars for any player still missing one
      #   - applies human-approved photos from data/photo_approvals.json
      #   - queues fresh photo candidates for review at photo-review.html
      #   - backfills Wikipedia bios for a small monthly batch
      # A total FIDE outage no longer stalls enrichment progress; the freshness
      # gate at the end still fails the run on stale ratings.
      - name: Enrich dataset (bios, photos, radars)
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python3 data/enrich_dataset.py

      - name: Rebuild per-player static pages + sitemap
        if: steps.gate.outputs.run == 'true'
        run: python3 data/build_pages.py

      - name: Commit and push updated data + pages
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "gm-almanac-bot"
          git config user.email "actions@users.noreply.github.com"

          if git diff --quiet -- gm-dashboard/data.json gm-dashboard/player gm-dashboard/sitemap.xml data/photo_candidates.json 2>/dev/null; then
            echo "No changes to data.json, generated pages, or photo candidates."
            exit 0
          fi

          # Only claim a rating period when THIS run actually refreshed the
          # data. Previously the period was read out of refresh_log.json even
          # when the refresh had failed, so a failed August run committed the
          # message "Monthly refresh + page rebuild: JUL26" and looked healthy.
          if [ "${{ steps.refresh.outputs.refresh_ok }}" = "true" ]; then
            PERIOD=$(python3 -c "import json; print(json.load(open('data/refresh_log.json')).get('rating_period','unknown'))")
            MSG="Monthly refresh + page rebuild: ${PERIOD}"
          else
            STALE=$(python3 -c "import json; print(json.load(open('gm-dashboard/data.json')).get('ratingPeriod','unknown'))")
            MSG="Page rebuild only — FIDE refresh FAILED, data still ${STALE}"
          fi

          git add gm-dashboard/data.json gm-dashboard/player gm-dashboard/sitemap.xml
          [ -f data/refresh_log.json ] && git add data/refresh_log.json
          # Also commit any enrichment side-effects (candidate queue moves,
          # approvals applied) so review state persists across runs.
          [ -f data/photo_candidates.json ] && git add data/photo_candidates.json
          git commit -m "$MSG"
          git push

      - name: Upload refresh log as artifact
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: refresh-log
          path: data/refresh_log.json
          retention-days: 90
          if-no-files-found: warn

      - name: Re-checkout after auto-commit
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          ref: master

      # The Neocities API deploys to the SITE ROOT, so we stage into
      # staging/chess/grandmaster_almanac/ to match the live URL path
      # scfromor.com/chess/grandmaster_almanac/. cleanup: false guarantees
      # nothing outside this subpath is touched — other subsites are never
      # orphaned or deleted.
      - name: Stage files under matching subpath
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p staging/chess/grandmaster_almanac
          cp -R gm-dashboard/. staging/chess/grandmaster_almanac/
          echo "Staged file count:"
          find staging -type f | wc -l

      - name: Deploy to Neocities
        if: steps.gate.outputs.run == 'true'
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          cleanup: false
          neocities_supporter: false
          preview_before_deploy: true
          dist_dir: staging

      # THE POINT OF THIS WHOLE FILE.
      #
      # Runs last so code-only changes still deploy, but fails the job — and
      # therefore triggers GitHub's failure notification email — whenever the
      # committed data is behind the current FIDE rating period. Without this,
      # a total FIDE outage is indistinguishable from a clean run.
      - name: Verify published data is current
        if: always() && steps.gate.outputs.run == 'true'
        run: python3 data/check_freshness.py --check
